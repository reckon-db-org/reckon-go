<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="reckon-go system context">
<title>reckon-go system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="720"/>
<rect class="b-per" x="30" y="30" width="250" height="122" rx="10"/>
<circle class="head" cx="56" cy="54" r="9"/>
<text class="t-name" x="74" y="58">Go application developer</text>
<text class="t-type" x="74" y="76">[Person]</text>
<text class="t-desc" x="46" y="100">Imports the module and calls</text>
<text class="t-desc" x="46" y="116">one sub-client per service,</text>
<text class="t-desc" x="46" y="132">with TLS on by default</text>
<rect class="b-per" x="375" y="30" width="250" height="122" rx="10"/>
<circle class="head" cx="401" cy="54" r="9"/>
<text class="t-name" x="419" y="58">Shell or CI user</text>
<text class="t-type" x="419" y="76">[Person]</text>
<text class="t-desc" x="391" y="100">Runs the reckon binary: JSON</text>
<text class="t-desc" x="391" y="116">out, NDJSON for streams, and</text>
<text class="t-desc" x="391" y="132">an exit code per failure</text>
<rect class="b-ext" x="720" y="30" width="250" height="122" rx="10"/>
<text class="t-name" x="736" y="58">reckon-nvim</text>
<text class="t-type" x="736" y="76">[External: a Lua editor plugin]</text>
<text class="t-desc" x="736" y="100">Drives the reckon binary over</text>
<text class="t-desc" x="736" y="116">its own job control and reads</text>
<text class="t-desc" x="736" y="132">its JSON; never gRPC itself</text>
<rect class="b-ext" x="30" y="210" width="250" height="122" rx="10"/>
<text class="t-name" x="46" y="238">Go application</text>
<text class="t-type" x="46" y="256">[External: the caller's program]</text>
<text class="t-desc" x="46" y="280">Links the SDK in process:</text>
<text class="t-desc" x="46" y="296">no sidecar and no daemon,</text>
<text class="t-desc" x="46" y="312">one Client per endpoint</text>
<rect class="b-sys" x="375" y="210" width="250" height="154" rx="10"/>
<text class="t-name" x="391" y="238">reckon-go</text>
<text class="t-type" x="391" y="256">[In scope: one Go module, v0.10.0]</text>
<text class="t-desc" x="391" y="280">An SDK with nine service</text>
<text class="t-desc" x="391" y="296">sub-clients behind one facade,</text>
<text class="t-desc" x="391" y="312">and the reckon CLI that exposes</text>
<text class="t-desc" x="391" y="328">the same surface as JSON for</text>
<text class="t-desc" x="391" y="344">shells and editors</text>
<rect class="b-ext" x="720" y="210" width="250" height="154" rx="10"/>
<text class="t-name" x="736" y="238">reckon-gateway</text>
<text class="t-type" x="736" y="256">[External: gRPC endpoint]</text>
<text class="t-desc" x="736" y="280">Answers reckon.gateway.v1:</text>
<text class="t-desc" x="736" y="296">Stores, Stream, Subscription,</text>
<text class="t-desc" x="736" y="312">Snapshot, Schema, Temporal,</text>
<text class="t-desc" x="736" y="328">Admin, Health and DCB. The SDK</text>
<text class="t-desc" x="736" y="344">has no default address</text>
<rect class="b-ext" x="30" y="430" width="250" height="138" rx="10"/>
<text class="t-name" x="46" y="458">reckon-proto</text>
<text class="t-type" x="46" y="476">[External: the wire contract]</text>
<text class="t-desc" x="46" y="500">Proto package reckon.gateway.v1;</text>
<text class="t-desc" x="46" y="516">the stubs in genproto are</text>
<text class="t-desc" x="46" y="532">generated from it and committed,</text>
<text class="t-desc" x="46" y="548">never generated at build time</text>
<rect class="b-ext" x="375" y="430" width="250" height="122" rx="10"/>
<text class="t-name" x="391" y="458">System CA trust store</text>
<text class="t-type" x="391" y="476">[External: the OS]</text>
<text class="t-desc" x="391" y="500">TLS is verified against the system</text>
<text class="t-desc" x="391" y="516">roots unless Insecure, TLSWithCA</text>
<text class="t-desc" x="391" y="532">or TLSWithServerName says otherwise</text>
<path class="edge" d="M155 157V210" marker-end="url(#a)"/>
<text class="t-rel" x="163" y="188">writes it</text>
<path class="edge" d="M280 285H375" marker-end="url(#a)"/>
<text class="t-rel" x="327" y="268" text-anchor="middle">imports</text>
<text class="t-rel" x="327" y="305" text-anchor="middle">the module</text>
<path class="edge" d="M500 157V210" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="202">runs the binary</text>
<path class="edge" d="M845 157V172H500V210" marker-end="url(#a)"/>
<text class="t-rel" x="700" y="164" text-anchor="middle">drives the binary</text>
<path class="edge" d="M625 285H720" marker-end="url(#a)"/>
<text class="t-rel" x="672" y="268" text-anchor="middle">gRPC over</text>
<text class="t-rel" x="672" y="305" text-anchor="middle">HTTP/2</text>
<path class="edge" d="M155 430V400H420V364" marker-end="url(#a)"/>
<text class="t-rel" x="163" y="420">generated into genproto</text>
<path class="edge" d="M500 364V430" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="400">verifies against</text>
<text class="t-desc" x="30" y="600">The SDK has no default endpoint: Connect needs an explicit host:port, and only the CLI and the examples</text>
<text class="t-desc" x="30" y="616">supply localhost:50051. There is no application authentication anywhere in the module: a caller that</text>
<text class="t-desc" x="30" y="632">needs a token or a client certificate passes its own grpc.DialOption, or wraps the exposed connection.</text>
<rect class="b-sys" x="24" y="686" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="698">In scope</text>
<rect class="b-per" x="119.2" y="686" width="22" height="14" rx="3"/>
<text class="t-leg" x="149.2" y="698">Person</text>
<rect class="b-mac" x="200.60000000000002" y="686" width="22" height="14" rx="3"/>
<text class="t-leg" x="230.60000000000002" y="698">Platform it runs on</text>
<rect class="b-ext" x="371.70000000000005" y="686" width="22" height="14" rx="3"/>
<text class="t-leg" x="401.70000000000005" y="698">External system</text>
<rect class="b-cmp" x="515.2" y="686" width="22" height="14" rx="3"/>
<text class="t-leg" x="545.2" y="698">Component</text>
</svg>
