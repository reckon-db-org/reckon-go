<text class="t-rel" x="871" y="244">builds</text>
<path class="edge" d="M516 120H484" marker-end="url(#a)"/>
<text class="t-rel" x="480" y="112" text-anchor="end">imports</text>
<path class="edge" d="M137 620V650H863V620"/>
<path class="edge" d="M379 620V650"/>
<path class="edge" d="M621 620V650"/>
<path class="edge" d="M500 650V680" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="672">through the stubs</text>
<path class="edge" d="M242 750H274" marker-end="url(#a)"/>
<text class="t-rel" x="258" y="742" text-anchor="middle">uses</text>
<path class="edge" d="M500 786V880" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="840">grpc-go over TLS</text>
<rect class="b-sys" x="24" y="1010" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="1022">In scope</text>
<rect class="b-per" x="119.2" y="1010" width="22" height="14" rx="3"/>
<text class="t-leg" x="149.2" y="1022">Person</text>
<rect class="b-mac" x="200.60000000000002" y="1010" width="22" height="14" rx="3"/>
<text class="t-leg" x="230.60000000000002" y="1022">Platform it runs on</text>
<rect class="b-ext" x="371.70000000000005" y="1010" width="22" height="14" rx="3"/>
<text class="t-leg" x="401.70000000000005" y="1022">External system</text>
<rect class="b-cmp" x="515.2" y="1010" width="22" height="14" rx="3"/>
<text class="t-leg" x="545.2" y="1022">Component</text>
<rect class="bound" x="617.3000000000001" y="1010" width="22" height="14" rx="3"/>
