# This exists so a change to the SDK cannot land unless it compiles, vets and
# passes its tests with the race detector on.
#
# THIS REPOSITORY HAD NO TEST CI. Its only workflow was release.yml, which runs
# on a v* tag and publishes binaries; nothing ran when code was pushed to main.
#
# Modeled on macula-io/macula-fovea's ci.yml, this org's standard for Go.
#
# The reference reads the Go version out of .tool-versions with an awk step.
# This repository has no .tool-versions, so the version comes from go.mod,
# which is where it is already written.
name: ci

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vet + test -race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::not gofmt-clean: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      # THE STRUCTURAL FLOOR (macula-io/macula-codebase-checks#9): deep nesting
      # and tangled functions fail the build. The caps are spelled out in
      # .golangci.yml, never taken from a tool default, and there is no baseline.
      - name: Structural lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout 10m
