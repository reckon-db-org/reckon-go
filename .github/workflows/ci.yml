# This exists so a change to the SDK cannot land unless it compiles, vets and
# passes its tests with the race detector on.
#
# THIS REPOSITORY HAD NO TEST CI. Its only workflow was release.yml, which runs
# on a v* tag and publishes binaries; nothing ran when code was pushed to main.
#
# Modeled on macula-io/macula-fovea's ci.yml, this org's standard for Go.
#
# ⚠ gofmt is NOT a step yet. Ten files in the tree are not gofmt-clean
# (measured 2026-10-20: cmd/filter-probe/main.go, cmd/probe/main.go, and eight
# under dcb/, health/, snapshots/, stores/ and streams/), so adding the check
# now would make this workflow red on its first run and every run after it.
# That is a source fix, not a CI fix. Add the step in the change that
# reformats them.
#
# The reference reads the Go version out of .tool-versions with an awk step.
# This repository has no .tool-versions, so the version comes from go.mod,
# which is where it is already written.
name: ci

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vet + test -race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...
