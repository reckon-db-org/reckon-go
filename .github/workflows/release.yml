# Builds the `reckon` CLI for all platforms and publishes the binaries as a
# GitHub Release when a v* tag lands. scripts/install.sh resolves the same
# asset names from that release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile binaries
        run: scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/reckon_*
            dist/SHA256SUMS
